name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            artifact: WorkNetConnector-windows-x86_64-ci
            executable: dist/WorkNetConnector.exe
          - platform: linux-x86_64
            os: ubuntu-22.04
            artifact: WorkNetConnector-linux-x86_64-ci
            executable: dist/WorkNetConnector

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb

      - name: Install, test, and build on Windows
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1

      - name: Install, test, and build on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/build.sh

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14
