name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            artifact: release-windows-x86_64
            release_path: release-assets/WorkNetConnector-windows-x86_64.exe
          - platform: linux-x86_64
            os: ubuntu-22.04
            artifact: release-linux-x86_64
            release_path: release-assets/WorkNetConnector-linux-x86_64

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb

      - name: Install, test, and build on Windows
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1

      - name: Install, test, and build on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/build.sh

      - name: Stage Windows release binary
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath dist/WorkNetConnector.exe -Destination release-assets/WorkNetConnector-windows-x86_64.exe

      - name: Stage Linux release binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          cp dist/WorkNetConnector release-assets/WorkNetConnector-linux-x86_64
          chmod +x release-assets/WorkNetConnector-linux-x86_64

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.release_path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksum manifest
        working-directory: release-assets
        run: sha256sum WorkNetConnector-windows-x86_64.exe WorkNetConnector-linux-x86_64 > SHA256SUMS.txt

      - name: Ensure release exists
        working-directory: release-assets
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Synchronize release assets
        working-directory: release-assets
        run: |
          asset_names="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            case "$asset" in
              WorkNetConnector-windows-x86_64.exe|WorkNetConnector-linux-x86_64|SHA256SUMS.txt) ;;
              *) gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes ;;
            esac
          done <<< "$asset_names"
          gh release upload "$GITHUB_REF_NAME" \
            WorkNetConnector-windows-x86_64.exe \
            WorkNetConnector-linux-x86_64 \
            SHA256SUMS.txt \
            --clobber

      - name: Publish release
        working-directory: release-assets
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --title "$GITHUB_REF_NAME"
